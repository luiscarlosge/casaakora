version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: "/client"
    schedule: { interval: monthly }
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
  - package-ecosystem: terraform
    directory: "/infra"
    schedule: { interval: monthly }
