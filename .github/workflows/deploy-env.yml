name: Deploy (reutilizable)

# Llamado desde cd.yml una vez por ambiente: terraform apply + despliegue + smoke test.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terraform + despliegue (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.tf.outputs.webapp_url }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ inputs.environment == 'prod' && vars.AZURE_CLIENT_ID_PROD || vars.AZURE_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra
            .github

      - uses: ./.github/actions/terraform
        with:
          environment: ${{ inputs.environment }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

      - name: terraform plan
        working-directory: infra
        run: terraform plan -input=false -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan

      - name: terraform apply
        id: tf
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "webapp_name=$(terraform output -raw webapp_name)" >> "$GITHUB_OUTPUT"
          echo "webapp_url=$(terraform output -raw webapp_url)"   >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: app-package

      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Desplegar a App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.tf.outputs.webapp_name }}
          package: app.zip
          type: zip
          restart: true

      - name: Smoke test
        env:
          URL: ${{ steps.tf.outputs.webapp_url }}
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_SHA::7}"
          ok=""
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 15 "$URL/health" || true)"
            if echo "$BODY" | grep -q "\"version\":\"$EXPECTED\""; then
              echo "OK /health → $BODY"; ok=1; break
            fi
            echo "Intento $i: aún no responde la versión $EXPECTED (${BODY:-sin respuesta})"; sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$URL no respondió con la versión $EXPECTED"; exit 1; }
          curl -fsS  --max-time 15 "$URL/"          | grep -q '<div id="root">'
          curl -fsS  --max-time 15 "$URL/api/fotos" | grep -q 'fotos360/web'
          curl -fsSI --max-time 15 "$URL/fotos360/thumbs/SalaPiso1.jpg" | grep -qi 'content-type: image/jpeg'
          echo "### ✅ ${{ inputs.environment }}: $URL ($EXPECTED)" >> "$GITHUB_STEP_SUMMARY"
